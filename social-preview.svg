<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Manifold Studio · Idea Search</title>
  <desc id="desc">Compare, judge, propose, decide, regenerate, and trace.</desc>
  <defs>
    <radialGradient id="cyan-atmosphere" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(110 28) rotate(31) scale(610 360)">
      <stop stop-color="#22d3ee" stop-opacity=".14"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember-atmosphere" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1110 24) rotate(145) scale(520 320)">
      <stop stop-color="#fc4c0d" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fc4c0d" stop-opacity="0"/>
    </radialGradient>
    <filter id="edge-glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#04060f"/>
  <rect width="1200" height="630" fill="url(#cyan-atmosphere)"/>
  <rect width="1200" height="630" fill="url(#ember-atmosphere)"/>
  <rect x="44" y="44" width="1112" height="542" rx="24" fill="#070b18" stroke="#26324e"/>

  <image href="manifold-mark.png" x="78" y="72" width="78" height="61" preserveAspectRatio="xMidYMid meet"/>
  <text x="174" y="114" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="38" font-weight="700" fill="#fff">Manifold</text>
  <line x1="378" y1="81" x2="378" y2="122" stroke="#34415e" stroke-width="2"/>
  <text x="399" y="113" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="25" font-weight="500" fill="#9fb0d0">Studio</text>
  <text x="1058" y="105" text-anchor="end" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17" letter-spacing="2" fill="#7d8fb3">RECORDED WALKTHROUGH</text>

  <text x="78" y="209" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="18" font-weight="700" letter-spacing="3" fill="#22d3ee">IDEA SEARCH</text>
  <text x="78" y="290" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="68" font-weight="720" letter-spacing="-2" fill="#fff">The model drafts.</text>
  <text x="78" y="365" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="60" font-weight="720" letter-spacing="-2" fill="#fff">You decide what carries forward.</text>
  <text x="78" y="414" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="24" fill="#9fb0d0">One evidence-backed loop from comparison to provenance.</text>

  <rect x="84" y="493" width="1032" height="68" rx="20" fill="#22d3ee" opacity=".09" filter="url(#edge-glow)"/>
  <g font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-weight="700">
    <g transform="translate(78 482)">
      <rect width="157" height="70" rx="13" fill="#0e1a34" stroke="#22d3ee" stroke-opacity=".65"/>
      <text x="18" y="27" font-size="13" letter-spacing="1.5" fill="#7d8fb3">01</text>
      <text x="18" y="51" font-size="17" letter-spacing="1" fill="#f2f6ff">COMPARE</text>
    </g>
    <g transform="translate(255 482)">
      <rect width="157" height="70" rx="13" fill="#0e1a34" stroke="#22d3ee" stroke-opacity=".55"/>
      <text x="18" y="27" font-size="13" letter-spacing="1.5" fill="#7d8fb3">02</text>
      <text x="18" y="51" font-size="17" letter-spacing="1" fill="#f2f6ff">JUDGE</text>
    </g>
    <g transform="translate(432 482)">
      <rect width="157" height="70" rx="13" fill="#0e1a34" stroke="#22d3ee" stroke-opacity=".55"/>
      <text x="18" y="27" font-size="13" letter-spacing="1.5" fill="#7d8fb3">03</text>
      <text x="18" y="51" font-size="17" letter-spacing="1" fill="#f2f6ff">PROPOSE</text>
    </g>
    <g transform="translate(609 482)">
      <rect width="157" height="70" rx="13" fill="#0e1a34" stroke="#22d3ee" stroke-opacity=".55"/>
      <text x="18" y="27" font-size="13" letter-spacing="1.5" fill="#7d8fb3">04</text>
      <text x="18" y="51" font-size="17" letter-spacing="1" fill="#f2f6ff">DECIDE</text>
    </g>
    <g transform="translate(786 482)">
      <rect width="157" height="70" rx="13" fill="#0e1a34" stroke="#22d3ee" stroke-opacity=".55"/>
      <text x="18" y="27" font-size="13" letter-spacing="1.5" fill="#7d8fb3">05</text>
      <text x="18" y="51" font-size="16" letter-spacing=".5" fill="#f2f6ff">REGENERATE</text>
    </g>
    <g transform="translate(963 482)">
      <rect width="157" height="70" rx="13" fill="#0e1a34" stroke="#fc4c0d" stroke-opacity=".78"/>
      <text x="18" y="27" font-size="13" letter-spacing="1.5" fill="#7d8fb3">06</text>
      <text x="18" y="51" font-size="17" letter-spacing="1" fill="#f2f6ff">TRACE</text>
    </g>
  </g>
</svg>
