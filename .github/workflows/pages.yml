name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify SHA256SUMS
        run: |
          set -euo pipefail
          if [ ! -f SHA256SUMS ]; then
            echo "SHA256SUMS is missing from the repository root." >&2
            exit 1
          fi
          sha256sum -c SHA256SUMS

      - name: Verify canonical Manifold assets
        run: |
          set -euo pipefail
          test "$(sha256sum manifold-mark.png | cut -d ' ' -f1)" = \
            "29253c4af687e367234e03dd005b77285381589ed459a9c0e24ca21c9ff62cc4"
          test "$(sha256sum favicon.png | cut -d ' ' -f1)" = \
            "6b3d4998cc2083d22665aa36ab2042331ade3ae8032d002f8b23135d733a3261"
          file manifold-mark.png | grep -F "234 x 181"
          file favicon.png | grep -F "64 x 64"

      - name: Public-boundary check
        run: |
          set -euo pipefail
          # This bundle must never contain application source, build
          # tooling, or private project material -- only the static
          # showcase, its evidence, and publication metadata.
          fail=0
          for d in backend frontend scripts data docs .claude; do
            if [ -e "$d" ]; then
              echo "Forbidden private directory present: $d" >&2
              fail=1
            fi
          done
          if find . -type f \( \
              -name '*.py' -o -name '*.ts' -o -name '*.tsx' -o -name '*.js' \
              -o -name '*.jsx' -o -name 'package-lock.json' -o -name 'uv.lock' \
              -o -name 'poetry.lock' -o -name '*.env' -o -name '.env*' \
            \) -not -path './.git/*' | grep -q .; then
            echo "Forbidden source/lockfile/env file present in the bundle:" >&2
            find . -type f \( \
              -name '*.py' -o -name '*.ts' -o -name '*.tsx' -o -name '*.js' \
              -o -name '*.jsx' -o -name 'package-lock.json' -o -name 'uv.lock' \
              -o -name 'poetry.lock' -o -name '*.env' -o -name '.env*' \
            \) -not -path './.git/*' >&2
            fail=1
          fi
          # No terminology grep here, on purpose. A public workflow that
          # greps for confidential names has to spell them out -- which
          # publishes the very words it is guarding, and makes the step
          # match its own source on every run. Sensitive-name scanning is
          # the job of the private publication tooling, which runs before
          # this bundle is produced.
          exit "$fail"

      - name: Stage explicit public allowlist
        run: |
          set -euo pipefail
          mkdir -p _site/evidence/fixture/receipts
          install -m 0644 .nojekyll _site/.nojekyll
          install -m 0644 index.html _site/index.html
          install -m 0644 favicon.png _site/favicon.png
          install -m 0644 manifold-mark.png _site/manifold-mark.png
          install -m 0644 social-preview-brand-v1.png _site/social-preview-brand-v1.png
          install -m 0644 brand-provenance.json _site/brand-provenance.json
          install -m 0644 evidence/manifest.json _site/evidence/manifest.json
          install -m 0644 evidence/fixture/loop.json _site/evidence/fixture/loop.json
          install -m 0644 evidence/fixture/receipts/memory_receipt_1.md \
            _site/evidence/fixture/receipts/memory_receipt_1.md
          install -m 0644 evidence/fixture/receipts/memory_receipt_2.md \
            _site/evidence/fixture/receipts/memory_receipt_2.md
          install -m 0644 evidence/fixture/receipts/session_receipt.md \
            _site/evidence/fixture/receipts/session_receipt.md
          test "$(find _site -type f | wc -l)" -eq 11

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
