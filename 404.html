<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Idea Search Showcase · Redirecting</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://eduardo1100.github.io/Idea_Search_Showcase/">
  <script>
    (function () {
      var base = "https://eduardo1100.github.io/Idea_Search_Showcase/";
      var path = window.location.pathname.replace(/^\/manifold-studio(?:\/|$)/, "");
      if (path === "index.html") path = "";
      path = path.replace(/^\/+/, "");
      var target = base + path + window.location.search + window.location.hash;
      window.location.replace(target);
    }());
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=https://eduardo1100.github.io/Idea_Search_Showcase/"></noscript>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101318; color: #eef2f6; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { max-width: 36rem; padding: 3rem 1.5rem; }
    p { color: #b6c0cb; line-height: 1.6; }
    a { color: #b8f56b; }
  </style>
</head>
<body>
  <main>
    <h1>Idea Search has moved.</h1>
    <p>This address is kept so existing links continue to work.</p>
    <p><a href="https://eduardo1100.github.io/Idea_Search_Showcase/">Continue to Idea Search Showcase</a></p>
  </main>
</body>
</html>
